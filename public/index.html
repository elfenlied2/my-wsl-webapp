<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>じゃんけんゲーム</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    button { font-size: 20px; padding: 10px 20px; margin: 10px; }
    #result { font-size: 24px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>じゃんけんゲーム</h1>

  <button onclick="play('グー')">✊ グー</button>
  <button onclick="play('チョキ')">✌️ チョキ</button>
  <button onclick="play('パー')">🖐 パー</button>

  <div id="result"></div>

  <script>
    async function play(playerHand) {
      const res = await fetch(`/api/janken?hand=${playerHand}`);
      const data = await res.json();
      document.getElementById('result').innerText =
        `あなた: ${data.player} / 相手: ${data.cpu}\n結果: ${data.result}`;
    }
  </script>
</body>
</html>
